app:
  env: development
  host: 127.0.0.1
  port: 8000

paths:
  sample_data: data/samples
  generated_data: data/generated
  frontend_demo: frontend/demo

animation:
  default_renderer: canvas_2d
  allowed_renderers:
    - canvas_2d
    - svg_2d
    - three_3d

agent:
  # 单个 storyboard 场景里的教学节拍（step）数量上限，与下面的下限一起读。
  # 注意：这是「一幕里的节拍数」，不是「文档里的幕数」——幕数由 LessonIR 的覆盖关系决定。
  max_storyboard_steps: 7
  require_visual_objects: true
  require_interactive_demo: true

storyboard:
  # 单个场景的节拍数下限。上限沿用上面的 agent.max_storyboard_steps。
  min_storyboard_steps: 3
  # 比 knowledge 的 0.4 低：这一层是 schema 密集型，创作部分上游已经做完。
  temperature: 0.3
  max_retries: 3

llm:
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro

knowledge:
  # 场景数上限（硬校验，超出会打回重试）。prompt 引导 6~8，这里留一点余量。
  max_scenes: 8
  max_retries: 3
  temperature: 0.4
  # 要求原文每个 section / block 都至少被一个场景引用到，防止漏内容。
  # 若接入的文档带大量导航/页脚等噪声导致频繁重试，可改成 false。
  require_full_coverage: true
  # 生成后再调一次模型，核对「原文有没有被漏讲、课程有没有编原文没有的东西」。
  # 每次生成多一次 LLM 调用，默认关闭；打开前建议先用真实模型验证误报率。
  verify_fidelity: false

