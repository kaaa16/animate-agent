<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D 教学动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1e;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
  }
  .subtitle-bar {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(15,15,30,0.85); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 10px 28px;
    color: #e0e0e0; font-size: 16px; letter-spacing: 1px;
    pointer-events: none; z-index: 10;
    transition: opacity 0.5s; max-width: 80vw; text-align: center;
  }
  .step-indicator {
    position: fixed; top: 24px; right: 28px;
    display: flex; gap: 10px; z-index: 10;
  }
  .step-indicator .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3a3a55; transition: all 0.3s;
  }
  .step-indicator .dot.active {
    background: #7c5ce7; box-shadow: 0 0 12px rgba(124,92,231,0.5);
  }
  /* 参数面板 */
  .param-panel {
    position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
    background: rgba(15,15,30,0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 16px 18px;
    z-index: 10; min-width: 210px;
    display: none; color: #e0e0e0;
  }
  .param-panel .param-title {
    font-size: 13px; letter-spacing: 2px; color: #a0a0c0;
    margin-bottom: 14px; text-align: center;
  }
  .param-row { margin-bottom: 16px; }
  .param-row:last-child { margin-bottom: 0; }
  .param-row label {
    display: block; font-size: 12px; color: #b8b8d0; margin-bottom: 6px;
  }
  .param-row input[type="range"] {
    width: 100%; -webkit-appearance: none; appearance: none; height: 4px;
    border-radius: 2px; background: #3a3a55; outline: none; cursor: pointer;
  }
  .param-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #7c5ce7; cursor: pointer; border: 2px solid #fff;
  }
  .param-row .param-value {
    float: right; font-size: 12px; color: #7c5ce7; margin-top: 5px;
  }
  /* 速度读数面板 */
  .velocity-panel {
    position: fixed; left: 24px; top: 24px;
    background: rgba(15,15,30,0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 12px 16px;
    z-index: 10; min-width: 160px;
    display: none; color: #e0e0e0;
  }
  .velocity-panel .v-title {
    font-size: 12px; letter-spacing: 2px; color: #a0a0c0;
    margin-bottom: 8px; text-align: center;
  }
  .velocity-panel .v-row {
    font-size: 13px; line-height: 1.7; font-family: "Consolas", "Menlo", monospace;
    white-space: nowrap;
  }
  /* 暂停按钮 */
  .pause-btn {
    position: fixed; bottom: 24px; right: 24px;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(15,15,30,0.85); border: 1px solid rgba(255,255,255,0.2);
    color: #e0e0e0; font-size: 20px; cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  .pause-btn:hover { background: rgba(124,92,231,0.4); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="subtitle-bar" id="subtitle"></div>
<div class="step-indicator" id="stepDots"></div>
<div class="param-panel" id="paramPanel"></div>
<div class="velocity-panel" id="velocityPanel"></div>
<button class="pause-btn" id="pauseBtn" title="暂停/播放">⏸</button>

<script>
/* ═══════════════════════════════════════
   2D Canvas 模板播放器
   接收 lesson JSON → 场景控制器渲染
   ═══════════════════════════════════════ */

let lessonData = null;
let currentStep = 0;
let sceneController = null;  // { state, applyState, draw }
let simTime = 0;
let lastTs = 0;
let animFrameId = null;
let paused = false;
let lastNow = 0;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

/* ──────────────── 速度读数面板 ──────────────── */
let velocityPanelBuilt = false;
function setVelocityReadout(vx, vy, vmag) {
  const el = document.getElementById('velocityPanel');
  if (!el) return;
  if (!velocityPanelBuilt) {
    el.innerHTML =
      '<div class="v-title">速度读数</div>' +
      '<div class="v-row" id="vrVx" style="color:#38bdf8"></div>' +
      '<div class="v-row" id="vrVy" style="color:#34d399"></div>' +
      '<div class="v-row" id="vrV" style="color:#f97316"></div>';
    velocityPanelBuilt = true;
  }
  el.style.display = 'block';
  document.getElementById('vrVx').textContent = 'vx = ' + vx.toFixed(2) + ' m/s';
  document.getElementById('vrVy').textContent = 'vy = ' + (vy >= 0 ? '+' : '') + vy.toFixed(2) + ' m/s';
  document.getElementById('vrV').textContent = 'v = ' + vmag.toFixed(2) + ' m/s';
}
function hideVelocityReadout() {
  const el = document.getElementById('velocityPanel');
  if (el) el.style.display = 'none';
}

/* ──────────────── 暂停/播放 ──────────────── */
const pauseBtn = document.getElementById('pauseBtn');
if (pauseBtn) {
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
  });
}

/* ═══════════════════════════════════════
   场景构建器注册表
   每个构建器返回 { state, applyState(step), draw(time, dt) }
   ═══════════════════════════════════════ */
const sceneBuilders = {};

/* ──────────────── 可调参数注册表 ──────────────── */
const SCENE_PARAMS = {
  projectile_motion_2d: [
    { key: 'initialSpeed', label: '初速度', min: 2, max: 12, step: 0.5, unit: 'm/s' },
    { key: 'angle', label: '发射角度', min: 10, max: 85, step: 1, unit: '°' },
    { key: 'gravity', label: '重力加速度', min: 2, max: 12, step: 0.5, unit: 'm/s²' },
  ],
  force_analysis_2d: [
    { key: 'applied', label: '拉力大小', min: 0.4, max: 3, step: 0.1, unit: 'N' },
    { key: 'gravity', label: '重力大小', min: 0.4, max: 3, step: 0.1, unit: 'N' },
    { key: 'friction', label: '摩擦力大小', min: 0.4, max: 3, step: 0.1, unit: 'N' },
  ],
};

/* ── 通用工具：画箭头 ── */
function drawArrow(x1, y1, x2, y2, color, width = 3) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return;
  const angle = Math.atan2(dy, dx);

  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  // 箭头头部
  const hs = 10;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs * Math.cos(angle - 0.45), y2 - hs * Math.sin(angle - 0.45));
  ctx.lineTo(x2 - hs * Math.cos(angle + 0.45), y2 - hs * Math.sin(angle + 0.45));
  ctx.closePath();
  ctx.fill();
}

/* ── 背景粒子 ── */
let particles = [];
function initParticles() {
  particles = [];
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.3 + 0.1,
      alpha: Math.random() * 0.4 + 0.1,
    });
  }
}
function drawParticles(time) {
  particles.forEach(p => {
    p.y -= p.speed;
    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
    ctx.fillStyle = `rgba(124, 92, 231, ${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ═══════════════════════════════════════
   LiDAR 避障场景（俯视 2D）
   ═══════════════════════════════════════ */
sceneBuilders['lidar_obstacle_avoidance_2d'] = function(sceneData) {
  const sc = sceneData;
  const roadY = canvas.height * 0.55;
  const state = {
    carX: sc.car?.position?.[0] ?? canvas.width * 0.2,
    carY: roadY,
    carAngle: 0,
    lidarSpeed: 0.025,
    lidarOpacity: 0.12,
    obsScale: 1.0,
    obsEmissive: false,
    pathVisible: false,
    pathDots: (sc.path?.waypoints || []).map(p => ({ x: p[0], y: p[1] })),
  };

  function drawRoad() {
    const w = canvas.width, h = canvas.height;
    const ry = roadY, rh = h * 0.08;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, ry - rh / 2, w, rh);
    ctx.strokeStyle = '#3a3a55';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, ry - rh / 2); ctx.lineTo(w, ry - rh / 2);
    ctx.moveTo(0, ry + rh / 2); ctx.lineTo(w, ry + rh / 2);
    ctx.stroke();
    ctx.setLineDash([20, 20]);
    ctx.strokeStyle = '#2a2a45';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(w, ry); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawCar(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const bw = 80, bh = 40;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-bw / 2 + 2, -bh / 2 + 2, bw, bh);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.fillStyle = '#166534';
    ctx.fillRect(-bw / 6, -bh / 4, bw * 0.55, bh * 0.5);
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(bw / 2 - 12, -bh / 2 + 2, 10, 8);
    ctx.fillRect(bw / 2 - 12, bh / 2 - 10, 10, 8);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-bw / 2 + 2, -bh / 2 + 2, 6, 6);
    ctx.fillRect(-bw / 2 + 2, bh / 2 - 8, 6, 6);
    ctx.fillStyle = '#111827';
    [-1, 1].forEach(sy => {
      [-1, 1].forEach(sx => {
        ctx.fillRect(sx * bw * 0.35 - 6, sy * bh / 2 - 4, 12, 8);
      });
    });
    ctx.restore();
  }

  function drawLidar(x, y, time) {
    const maxRadius = 180, waves = 4;
    for (let i = 0; i < waves; i++) {
      const phase = (time * state.lidarSpeed * 8 + i / waves) % 1;
      const radius = phase * maxRadius;
      const alpha = state.lidarOpacity * (1 - phase) * 1.2;
      ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(radius, 2), 0, Math.PI * 2);
      ctx.stroke();
      if (radius > 10) {
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = `rgba(56, 189, 248, ${alpha * 0.5})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  function drawObstacle(x, y, time) {
    const baseW = 50, baseH = 50;
    const w = baseW * state.obsScale, h = baseH * state.obsScale;
    ctx.save();
    ctx.translate(x, y);
    if (state.obsEmissive) {
      const glow = Math.sin(time * 4) * 0.3 + 0.7;
      ctx.fillStyle = `rgba(239, 68, 68, ${glow * 0.6})`;
      ctx.fillRect(-w / 2 - 10, -h / 2 - 10, w + 20, h + 20);
    }
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-w / 2, -h / 6, w, h / 3);
    if (state.obsEmissive) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', 0, -2);
    }
    ctx.restore();
  }

  function drawPath(waypoints) {
    if (!state.pathVisible || waypoints.length < 2) return;
    ctx.strokeStyle = 'rgba(37, 99, 235, 0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(waypoints[0][0], waypoints[0][1]);
    for (let i = 1; i < waypoints.length; i++) ctx.lineTo(waypoints[i][0], waypoints[i][1]);
    ctx.stroke();
    ctx.setLineDash([]);
    waypoints.forEach(([px, py]) => {
      ctx.fillStyle = '#2563eb';
      ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(37, 99, 235, 0.4)';
      ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI * 2); ctx.fill();
    });
  }

  return {
    state,
    applyState(step) {
      const st = step.objectStates || {};
      if (st.lidar) {
        state.lidarSpeed = st.lidar.speed ?? 0.025;
        state.lidarOpacity = st.lidar.opacity ?? 0.12;
      }
      if (st.obstacle) {
        state.obsScale = st.obstacle.scale ?? 1.0;
        state.obsEmissive = st.obstacle.emissive !== '#000000' && st.obstacle.emissive !== null;
      }
      if (st.path) {
        state.pathVisible = !!st.path.visible;
        if (st.path.waypoints) state.pathDots = st.path.waypoints.map(p => ({ x: p[0], y: p[1] }));
      }
    },
    draw(time, dt) {
      drawParticles(time);
      drawRoad();
      const carSpeed = 120 * dt;  // 每秒 120px
      state.carX += carSpeed;
      if (state.carX > canvas.width + 100) state.carX = -100;
      const obsX = state.carX + 220;
      const obsY = roadY;

      const mapped = state.pathDots.map(p => [p.x, p.y]);
      if (state.pathVisible && mapped.length > 0) {
        drawPath(mapped);
      } else if (state.pathVisible) {
        drawPath([
          [state.carX - 30, roadY], [state.carX + 80, roadY],
          [obsX + 30, roadY - 80], [obsX + 120, roadY - 80], [obsX + 200, roadY],
        ]);
      }
      drawCar(state.carX, state.carY, 0);
      drawLidar(state.carX + 30, state.carY, time);
      drawObstacle(obsX, obsY, time);
    },
  };
};

/* ═══════════════════════════════════════
   抛物运动场景（2D）
   ═══════════════════════════════════════ */
sceneBuilders['projectile_motion_2d'] = function(sceneData) {
  const sc = sceneData;
  const originX = canvas.width * 0.18;
  const originY = canvas.height * 0.8;
  const scale = 70;  // px per 物理单位

  const state = {
    v0: sc.projectile?.initialSpeed ?? 5,
    angle: (sc.projectile?.angle ?? 45) * Math.PI / 180,
    g: sc.projectile?.gravity ?? 5,
    velVisible: false,
    trajVisible: false,
    apexVisible: false,
    rangeVisible: false,
    // 派生物理量（setParam 时重算）
    v0x: 0, v0y: 0, T: 0, range: 0, apexH: 0,
  };

  function recompute() {
    state.v0x = state.v0 * Math.cos(state.angle);
    state.v0y = state.v0 * Math.sin(state.angle);
    state.T = 2 * state.v0y / state.g;
    state.range = state.v0x * state.T;
    state.apexH = (state.v0y * state.v0y) / (2 * state.g);
  }
  recompute();

  function sx(x) { return originX + x * scale; }
  function sy(y) { return originY - y * scale; }

  function applyState(step) {
    const st = step.objectStates || {};
    if (st.velocity) state.velVisible = !!st.velocity.visible;
    if (st.trajectory) state.trajVisible = !!st.trajectory.visible;
    if (st.apex) state.apexVisible = !!st.apex.visible;
    if (st.range) state.rangeVisible = !!st.range.visible;
  }

  function draw(time, dt) {
    drawParticles(time);

    // 地面线
    ctx.strokeStyle = '#3a3a55';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, originY);
    ctx.lineTo(canvas.width, originY);
    ctx.stroke();

    // 小球瞬时位置（速度分解与小球共用）
    const t = simTime % state.T;
    const bx = state.v0x * t;
    const by = state.v0y * t - 0.5 * state.g * t * t;
    const bpx = sx(bx), bpy = sy(by);

    // 射程标记
    if (state.rangeVisible) {
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(originX, originY + 14);
      ctx.lineTo(sx(state.range), originY + 14);
      ctx.stroke();
      ctx.fillStyle = '#22c55e';
      ctx.font = '13px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('射程', (originX + sx(state.range)) / 2, originY + 32);
    }

    // 轨迹（点状）
    if (state.trajVisible) {
      ctx.fillStyle = '#2563eb';
      const N = 60;
      for (let i = 0; i <= N; i++) {
        const t2 = (i / N) * state.T;
        const x = state.v0x * t2;
        const y = state.v0y * t2 - 0.5 * state.g * t2 * t2;
        ctx.beginPath();
        ctx.arc(sx(x), sy(y), 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 速度分解（跟随小球）
    if (state.velVisible) {
      const vx = state.v0x;
      const vy = state.v0y - state.g * t;
      const vmag = Math.hypot(vx, vy);
      const VEL_PX = 14;  // 每 m/s 对应像素
      const tipX = bpx + vx * VEL_PX;
      const tipY = bpy - vy * VEL_PX;

      // 平行四边形辅助线（虚线）
      ctx.strokeStyle = 'rgba(148,163,184,0.5)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(bpx + vx * VEL_PX, bpy);   // vx 尖端
      ctx.lineTo(tipX, tipY);               // v 尖端
      ctx.moveTo(bpx, bpy - vy * VEL_PX);   // vy 尖端
      ctx.lineTo(tipX, tipY);               // v 尖端
      ctx.stroke();
      ctx.setLineDash([]);

      // vx（水平，青蓝）
      drawArrow(bpx, bpy, bpx + vx * VEL_PX, bpy, '#38bdf8', 4);
      // vy（竖直，绿）
      drawArrow(bpx, bpy, bpx, bpy - vy * VEL_PX, '#34d399', 4);
      // v（合速度，橙）
      drawArrow(bpx, bpy, tipX, tipY, '#f97316', 4);

      setVelocityReadout(vx, vy, vmag);
    } else {
      hideVelocityReadout();
    }

    // 最高点标记
    if (state.apexVisible) {
      const ax = sx(state.range / 2), ay = sy(state.apexH);
      const pulse = Math.sin(time * 4) * 3 + 8;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(ax, ay, pulse, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ax, ay, pulse + 6, 0, Math.PI * 2); ctx.stroke();
    }

    // 小球（抛体，循环飞行）
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(bpx, bpy, 10, 0, Math.PI * 2);
    ctx.fill();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(bpx - 3, bpy - 3, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function setParam(key, value) {
    if (key === 'initialSpeed') state.v0 = value;
    else if (key === 'angle') state.angle = value * Math.PI / 180;
    else if (key === 'gravity') state.g = value;
    recompute();
  }

  function getParams() {
    return { initialSpeed: state.v0, angle: state.angle * 180 / Math.PI, gravity: state.g };
  }

  return { state, applyState, draw, setParam, getParams };
};

/* ═══════════════════════════════════════
   受力分析场景（2D）
   ═══════════════════════════════════════ */
sceneBuilders['force_analysis_2d'] = function(sceneData) {
  const sc = sceneData;
  const cx = canvas.width * 0.5;
  const cy = canvas.height * 0.45;
  const bw = 100, bh = 100;
  const state = {
    gravity: false, normal: false, applied: false, friction: false,
    fApplied: sc.forces?.applied ?? 1.4,
    fGravity: sc.forces?.gravity ?? 1.1,
    fFriction: sc.forces?.friction ?? 1.1,
  };

  function setParam(key, value) {
    if (key === 'applied') state.fApplied = value;
    else if (key === 'gravity') state.fGravity = value;
    else if (key === 'friction') state.fFriction = value;
  }

  function getParams() {
    return { applied: state.fApplied, gravity: state.fGravity, friction: state.fFriction };
  }

  return {
    state,
    applyState(step) {
      const f = (step.objectStates || {}).forces || {};
      if (f.gravity !== undefined) state.gravity = !!f.gravity;
      if (f.normal !== undefined) state.normal = !!f.normal;
      if (f.applied !== undefined) state.applied = !!f.applied;
      if (f.friction !== undefined) state.friction = !!f.friction;
    },
    draw(time, dt) {
      drawParticles(time);

      // 地面
      const groundY = cy + bh / 2;
      ctx.strokeStyle = '#3a3a55';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      // 力箭头（从物体中心出发，长度 = 力大小 × 像素比例）
      const pxPerN = 80;
      const gLen = state.fGravity * pxPerN;
      const aLen = state.fApplied * pxPerN;
      const fLen = state.fFriction * pxPerN;
      const cx_ = cx, cy_ = cy;
      if (state.gravity) drawArrow(cx_, cy_, cx_, cy_ + gLen, '#3b82f6', 4);
      if (state.normal) drawArrow(cx_, cy_, cx_, cy_ - 80, '#22c55e', 4);
      if (state.applied) drawArrow(cx_, cy_, cx_ + aLen, cy_, '#f97316', 4);
      if (state.friction) drawArrow(cx_, cy_, cx_ - fLen, cy_, '#ef4444', 4);

      // 物体方块（轻微呼吸）
      const bob = Math.sin(time * 2) * 3;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(cx - bw / 2 + 3, cy - bh / 2 + 3 + bob, bw, bh);
      ctx.fillStyle = '#8b5cf6';
      ctx.fillRect(cx - bw / 2, cy - bh / 2 + bob, bw, bh);
      ctx.strokeStyle = '#c4b5fd';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx - bw / 2, cy - bh / 2 + bob, bw, bh);

      // 力标签（跟随箭头尖端）
      ctx.font = '14px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      if (state.gravity) { ctx.fillStyle = '#3b82f6'; ctx.fillText('重力 G', cx, cy + gLen + 18); }
      if (state.normal) { ctx.fillStyle = '#22c55e'; ctx.fillText('支持力 N', cx, cy - 95); }
      if (state.applied) { ctx.fillStyle = '#f97316'; ctx.fillText('拉力 F', cx + aLen + 18, cy - 12); }
      if (state.friction) { ctx.fillStyle = '#ef4444'; ctx.fillText('摩擦力 f', cx - fLen - 18, cy - 12); }
    },
    setParam,
    getParams,
  };
};

/* ═══════════════════════════════════════
   通用 2D 场景（兜底）
   ═══════════════════════════════════════ */
sceneBuilders['generic_2d'] = function(sceneData) {
  return {
    state: {},
    applyState(step) {},
    draw(time, dt) {
      drawParticles(time);
    },
  };
};

/* ═══════════════════════════════════════
   主渲染循环
   ═══════════════════════════════════════ */

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initParticles();
}
window.addEventListener('resize', resize);
resize();

function render(timestamp) {
  const now = timestamp * 0.001;
  if (lastTs === 0) lastTs = now;
  const dt = Math.min(now - lastTs, 0.1);
  lastTs = now;

  if (!paused) {
    simTime += dt;
    lastNow = now;
  }
  const animTime = paused ? lastNow : now;

  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0f0f1e';
  ctx.fillRect(0, 0, w, h);

  if (sceneController && sceneController.draw) {
    sceneController.draw(animTime, dt);
  }

  // 顶部标题
  if (lessonData && lessonData.meta) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '14px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(lessonData.meta.title || '', 24, 40);
  }

  animFrameId = requestAnimationFrame(render);
}

/* ═══════════════════════════════════════
   步骤管理
   ═══════════════════════════════════════ */

function applyStep(idx) {
  currentStep = idx;
  const steps = lessonData?.steps || [];
  if (idx >= steps.length) return;

  const step = steps[idx];
  const subEl = document.getElementById('subtitle');
  if (subEl && step.description) {
    subEl.textContent = step.description;
    subEl.style.opacity = '0';
    requestAnimationFrame(() => { subEl.style.opacity = '1'; });
  }
  updateDots();

  if (sceneController && sceneController.applyState) {
    sceneController.applyState(step);
  }
}

function updateDots() {
  const steps = lessonData?.steps || [];
  const container = document.getElementById('stepDots');
  if (!container) return;
  container.innerHTML = '';
  steps.forEach((s, i) => {
    const dot = document.createElement('span');
    dot.className = 'dot' + (i === currentStep ? ' active' : '');
    container.appendChild(dot);
  });
}

/* ═══════════════════════════════════════
   数据加载
   ═══════════════════════════════════════ */

function buildScene(data) {
  hideVelocityReadout();
  const sceneCfg = data.scene || {};
  const builder = sceneBuilders[sceneCfg.type] || sceneBuilders['generic_2d'];
  sceneController = builder(sceneCfg);
  renderParamPanel();
  simTime = 0;
}

/* ──────────────── 参数面板 ──────────────── */
function renderParamPanel() {
  const panel = document.getElementById('paramPanel');
  if (!panel) return;
  const sceneType = lessonData?.scene?.type;
  const params = SCENE_PARAMS[sceneType];
  const hasSetParam = sceneController && typeof sceneController.setParam === 'function';

  if (!params || !params.length || !hasSetParam) {
    panel.innerHTML = '';
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';
  const current = sceneController.getParams ? sceneController.getParams() : {};
  panel.innerHTML = '<div class="param-title">可调参数</div>';

  params.forEach(p => {
    const val = current[p.key] ?? p.min;
    const row = document.createElement('div');
    row.className = 'param-row';

    const label = document.createElement('label');
    label.textContent = p.label;

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = p.min;
    slider.max = p.max;
    slider.step = p.step;
    slider.value = val;

    const valueEl = document.createElement('span');
    valueEl.className = 'param-value';
    valueEl.textContent = val + (p.unit ? ' ' + p.unit : '');

    slider.addEventListener('input', () => {
      const v = parseFloat(slider.value);
      valueEl.textContent = v + (p.unit ? ' ' + p.unit : '');
      if (sceneController.setParam) sceneController.setParam(p.key, v);
    });

    row.appendChild(label);
    row.appendChild(slider);
    row.appendChild(valueEl);
    panel.appendChild(row);
  });
}

function init(data) {
  lessonData = data;
  resize();
  buildScene(data);
  applyStep(0);
  if (!animFrameId) {
    lastTs = 0;
    animFrameId = requestAnimationFrame(render);
  }
}

/* ═══════════════════════════════════════
   外部 API
   ═══════════════════════════════════════ */

window.changeScene = function(n) {
  if (lessonData && n >= 0 && n < lessonData.steps.length) {
    applyStep(n);
  }
};

window.getSceneCount = function() {
  return lessonData ? lessonData.steps.length : 0;
};

/* ═══════════════════════════════════════
   接收数据
   ═══════════════════════════════════════ */

window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'lesson-data') {
    init(event.data.payload);
  }
});

// 支持 URL hash 中的 base64 JSON
if (window.location.hash && window.location.hash.length > 1) {
  try {
    const json = decodeURIComponent(escape(atob(window.location.hash.slice(1))));
    init(JSON.parse(json));
  } catch (e) {
    console.error('Failed to parse lesson data from URL hash:', e);
  }
}

console.log('[player-template-2d] 就绪，等待 lesson 数据...');
</script>
