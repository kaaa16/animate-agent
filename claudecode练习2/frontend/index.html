<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学动画生成器</title>
<style>
  :root {
    --bg: #0f0f1e;
    --panel: #1a1a2e;
    --text: #e0e0e0;
    --muted: #8888aa;
    --accent: #7c5ce7;
    --accent2: #00d4aa;
    --border: #2a2a3e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ═══════════════════════════════════════════
     State Container
     ═══════════════════════════════════════════ */
  .state { display: none; }
  .state.active { display: flex; }

  /* ═══════════════════════════════════════════
     State 1 — Upload Dialog
     ═══════════════════════════════════════════ */
  #stateUpload {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: radial-gradient(ellipse at center, #14142a 0%, #0b0b18 100%);
  }

  .upload-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 56px 64px;
    text-align: center;
    max-width: 540px;
    width: 90%;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .upload-card .icon-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 28px;
  }
  .upload-card .icon-row .fmt-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: rgba(124,92,231,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #b09af0;
    letter-spacing: 1px;
    border: 1px solid rgba(124,92,231,0.15);
  }

  .upload-card h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ffffff 0%, #b0b0d0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .upload-card .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .drop-zone {
    border: 2px dashed #3a3a55;
    border-radius: 16px;
    padding: 48px 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    background: rgba(255,255,255,0.015);
  }
  .drop-zone:hover,
  .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(124,92,231,0.06);
    box-shadow: 0 0 40px rgba(124,92,231,0.1);
    transform: scale(1.02);
  }
  .drop-zone.drag-over {
    border-style: solid;
    box-shadow: 0 0 50px rgba(124,92,231,0.2);
  }

  .drop-zone .upload-icon {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(124,92,231,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    transition: transform 0.3s;
  }
  .drop-zone.drag-over .upload-icon {
    transform: scale(1.15);
  }

  .drop-zone .main-text {
    font-size: 16px;
    color: #c0c0d8;
    margin-bottom: 6px;
  }
  .drop-zone .hint-text {
    font-size: 13px;
    color: var(--muted);
  }

  .error-msg {
    color: #fb7185;
    font-size: 13px;
    margin-top: 14px;
    min-height: 20px;
    animation: shake 0.5s ease;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-6px); }
    80%      { transform: translateX(6px); }
  }

  /* 2D / 3D / Template 切换 */
  .mode-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    user-select: none;
  }
  .mode-toggle .mode-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .mode-toggle .mode-btn:hover {
    border-color: #5a5a7a;
    color: #c0c0d8;
  }
  .mode-toggle .mode-btn.active {
    background: rgba(124,92,231,0.15);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(124,92,231,0.15);
  }

  input[type="file"] { display: none; }

  /* ═══════════════════════════════════════════
     State 2 — Loading
     ═══════════════════════════════════════════ */
  #stateLoading {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: radial-gradient(ellipse at center, #14142a 0%, #0b0b18 100%);
  }

  .loader-ring {
    width: 80px; height: 80px;
    position: relative;
    margin-bottom: 36px;
  }
  .loader-ring .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }
  .loader-ring .ring:nth-child(1) {
    border-top-color: var(--accent);
    animation: spin 1.2s linear infinite;
  }
  .loader-ring .ring:nth-child(2) {
    inset: 10px;
    border-right-color: var(--accent2);
    animation: spin 0.9s linear infinite reverse;
  }
  .loader-ring .ring:nth-child(3) {
    inset: 20px;
    border-bottom-color: #b09af0;
    animation: spin 1.5s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-text {
    font-size: 17px;
    color: #c0c0d8;
    margin-bottom: 10px;
    letter-spacing: 1px;
    transition: opacity 0.5s;
  }
  .status-sub {
    font-size: 13px;
    color: var(--muted);
  }

  /* 顶部进度条（视觉安抚） */
  .loader-bar {
    position: fixed; top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 0 2px 2px 0;
    transition: width 0.6s ease;
    z-index: 10;
  }

  .cancel-btn {
    margin-top: 40px;
    background: transparent;
    border: 1px solid #3a3a55;
    color: var(--muted);
    padding: 8px 28px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.25s;
  }
  .cancel-btn:hover {
    border-color: #fb7185;
    color: #fb7185;
  }

  /* ═══════════════════════════════════════════
     State 3 — Fullscreen Player
     ═══════════════════════════════════════════ */
  #statePlayer {
    position: fixed; inset: 0;
    background: #000;
  }

  #animationFrame {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }

  /* 导航覆盖层 */
  .nav-overlay {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 20px 24px 28px;
    background: linear-gradient(transparent, rgba(15,15,30,0.92) 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 10;
    transition: opacity 0.5s ease;
    pointer-events: auto;
  }
  .nav-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    justify-content: flex-end;
    z-index: 10;
    transition: opacity 0.5s ease;
  }
  .top-bar.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .reupload-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid #3a3a55;
    color: var(--muted);
    padding: 7px 18px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.25s;
    backdrop-filter: blur(8px);
  }
  .reupload-btn:hover {
    border-color: var(--accent);
    color: #fff;
    background: rgba(124,92,231,0.15);
  }

  .nav-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid #3a3a55;
    background: rgba(15,15,30,0.7);
    color: #c0c0d8;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .nav-btn:hover {
    border-color: var(--accent);
    color: #fff;
    background: rgba(124,92,231,0.15);
    box-shadow: 0 0 20px rgba(124,92,231,0.15);
  }
  .nav-btn:active { transform: scale(0.9); }
  .nav-btn:disabled {
    opacity: 0.25; cursor: not-allowed;
  }
  .nav-btn:disabled:hover {
    border-color: #3a3a55; background: rgba(15,15,30,0.7); box-shadow: none;
  }

  .scene-dots {
    display: flex; gap: 10px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #3a3a55;
    cursor: pointer;
    transition: all 0.3s;
  }
  .dot.active {
    background: var(--accent);
    box-shadow: 0 0 14px rgba(124,92,231,0.5);
    transform: scale(1.3);
  }
  .dot:hover:not(.active) {
    background: #5a5a7a;
  }

  .scene-counter {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
    min-width: 60px;
    text-align: center;
  }

  /* ═══════════════════════════════════════════
     Error Overlay (in loading area)
     ═══════════════════════════════════════════ */
  .error-card {
    background: var(--panel);
    border: 1px solid #fb7185;
    border-radius: 16px;
    padding: 36px 40px;
    text-align: center;
    max-width: 440px;
  }
  .error-card .err-icon {
    font-size: 40px; margin-bottom: 14px;
  }
  .error-card .err-title {
    font-size: 18px; font-weight: 600;
    color: #fb7185; margin-bottom: 8px;
  }
  .error-card .err-detail {
    font-size: 14px; color: var(--muted);
    margin-bottom: 22px; line-height: 1.6;
  }
  .retry-btn {
    background: rgba(124,92,231,0.15);
    border: 1px solid var(--accent);
    color: #b09af0;
    padding: 9px 32px;
    border-radius: 22px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.25s;
  }
  .retry-btn:hover {
    background: rgba(124,92,231,0.25);
    box-shadow: 0 0 20px rgba(124,92,231,0.15);
  }

  @media (max-width: 600px) {
    .upload-card { padding: 32px 24px; }
    .upload-card h1 { font-size: 20px; }
    .drop-zone { padding: 32px 16px; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════
 State 1: Upload Dialog
 ════════════════════════════════════════════ -->
<div id="stateUpload" class="state active">
  <div class="upload-card">
    <div class="icon-row">
      <span class="fmt-icon">PPTX</span>
      <span class="fmt-icon">DOCX</span>
      <span class="fmt-icon">PDF</span>
    </div>
    <h1>上传教学文件</h1>
    <p class="subtitle">拖拽或点击下方区域，AI 将自动生成教学动画</p>

    <div class="drop-zone" id="dropZone">
      <div class="upload-icon">&#128196;</div>
      <p class="main-text">拖拽文件到此处</p>
      <p class="hint-text">支持 PowerPoint、Word、PDF 格式</p>
    </div>

    <input type="file" id="fileInput" accept=".pptx,.docx,.pdf">

    <div class="mode-toggle">
      <button class="mode-btn" data-mode="2d">2D 动画</button>
      <button class="mode-btn active" data-mode="3d">3D 动画</button>
    </div>

    <p class="error-msg" id="uploadError"></p>
  </div>
</div>

<!-- ═══════════════════════════════════════════
 State 2: Loading
 ════════════════════════════════════════════ -->
<div id="stateLoading" class="state">
  <div class="loader-bar" id="loaderBar"></div>
  <div class="loader-ring">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
  <p class="status-text" id="statusText">正在提取文本...</p>
  <p class="status-sub" id="statusSub"></p>
  <button class="cancel-btn" id="cancelBtn" style="display:none;">取消</button>
  <div id="errorArea"></div>
</div>

<!-- ═══════════════════════════════════════════
 State 3: Fullscreen Player
 ════════════════════════════════════════════ -->
<div id="statePlayer" class="state">
  <div class="top-bar" id="topBar">
    <button class="reupload-btn" id="reuploadBtn">&#8634; 重新上传</button>
  </div>

  <iframe id="animationFrame"
          sandbox="allow-scripts allow-same-origin"
          referrerpolicy="no-referrer"
          title="教学动画"></iframe>

  <div class="nav-overlay" id="navOverlay">
    <button class="nav-btn" id="btnPrev" title="上一页">&#8592;</button>
    <div class="scene-dots" id="dots"></div>
    <button class="nav-btn" id="btnNext" title="下一页">&#8594;</button>
    <span class="scene-counter" id="counter"></span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  State Management
// ═══════════════════════════════════════════════
const STATE = { UPLOAD: 0, LOADING: 1, PLAYER: 2 };
let currentState = STATE.UPLOAD;

let scenes = [];
let animationHtml = '';
let currentSceneIdx = 0;
let loadingTimer = null;
let loadingProgress = 0;
let hideOverlayTimer = null;
let abortController = null;
let abortedByTimeout = false;
let currentMode = '3d';  // 默认 3D

const $ = id => document.getElementById(id);

// Mode toggle (2D / 3D)
(function initModeToggle() {
  const btns = document.querySelectorAll('.mode-toggle .mode-btn');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentMode = btn.dataset.mode;
      btns.forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
    });
  });
})();

function switchState(state) {
  currentState = state;
  $('stateUpload').classList.toggle('active', state === STATE.UPLOAD);
  $('stateLoading').classList.toggle('active', state === STATE.LOADING);
  $('statePlayer').classList.toggle('active', state === STATE.PLAYER);

  if (state === STATE.LOADING) {
    startLoadingAnimation();
  } else {
    stopLoadingAnimation();
  }
}

// ═══════════════════════════════════════════════
//  State 1 — Upload Logic
// ═══════════════════════════════════════════════
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const uploadError = $('uploadError');

// Click to browse
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

// Drag & drop
['dragenter','dragover','dragleave','drop'].forEach(evt => {
  document.body.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
});

dropZone.addEventListener('dragenter', () => dropZone.classList.add('drag-over'));
dropZone.addEventListener('dragover',  () => dropZone.classList.add('drag-over'));
dropZone.addEventListener('dragleave', (e) => {
  if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over');
});
dropZone.addEventListener('drop', (e) => {
  dropZone.classList.remove('drag-over');
  const files = e.dataTransfer.files;
  if (files.length) handleFile(files[0]);
});

// Paste from clipboard
document.addEventListener('paste', (e) => {
  if (currentState !== STATE.UPLOAD) return;
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.kind === 'file') {
      handleFile(item.getAsFile());
      break;
    }
  }
});

function handleFile(file) {
  uploadError.textContent = '';

  // Validate extension
  const name = file.name.toLowerCase();
  const ext = name.includes('.') ? '.' + name.split('.').pop() : '';
  const allowed = ['.pptx', '.docx', '.pdf'];
  if (!allowed.includes(ext)) {
    showUploadError('不支持的文件格式。请上传 PPTX / DOCX / PDF 文件。');
    return;
  }

  // Validate size (10 MB)
  if (file.size > 10 * 1024 * 1024) {
    showUploadError(`文件过大（${(file.size/1024/1024).toFixed(1)} MB），最大支持 10 MB。`);
    return;
  }

  // Show loading & start upload
  $('statusSub').textContent = file.name;
  switchState(STATE.LOADING);
  uploadAndGenerate(file);
}

function showUploadError(msg) {
  uploadError.textContent = msg;
  uploadError.style.animation = 'none';
  uploadError.offsetHeight;
  uploadError.style.animation = 'shake 0.5s ease';
}

// ═══════════════════════════════════════════════
//  State 2 — Loading + API Call
// ═══════════════════════════════════════════════
const STATUS_MESSAGES = [
  { text: '正在提取文本...',       pct: 10 },
  { text: 'AI 正在分析内容结构...', pct: 25 },
  { text: 'AI 正在优化教学脚本...', pct: 50 },
  { text: 'AI 正在生成 3D 场景...', pct: 75 },
  { text: '即将完成...',           pct: 90 },
];

let statusMsgIdx = 0;
let progressInterval = null;
let totalWait = 0;
const MSG_INTERVAL = 8000;  // 8s per message
const TIMEOUT_MS = 600000;  // 10 min

function startLoadingAnimation() {
  statusMsgIdx = 0;
  loadingProgress = 0;
  totalWait = 0;
  $('statusText').textContent = STATUS_MESSAGES[0].text;
  $('statusText').style.opacity = '1';
  $('loaderBar').style.width = '0%';
  $('cancelBtn').style.display = 'block';
  $('errorArea').innerHTML = '';

  progressInterval = setInterval(() => {
    statusMsgIdx++;
    totalWait += MSG_INTERVAL;
    if (statusMsgIdx < STATUS_MESSAGES.length) {
      const m = STATUS_MESSAGES[statusMsgIdx];
      $('statusText').style.opacity = '0';
      setTimeout(() => {
        $('statusText').textContent = m.text;
        $('statusText').style.opacity = '1';
      }, 400);
      $('loaderBar').style.width = m.pct + '%';
    }
    // After all messages, just keep the bar near 95%
    if (statusMsgIdx >= STATUS_MESSAGES.length) {
      $('loaderBar').style.width = '95%';
    }
    // Timeout check
    if (totalWait > TIMEOUT_MS) {
      abortedByTimeout = true;
      if (abortController) abortController.abort();
      stopLoadingAnimation();
      showError('请求超时', 'AI 处理时间较长，请稍后重试或尝试更小的文件。');
    }
  }, MSG_INTERVAL);
}

function stopLoadingAnimation() {
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
}

async function uploadAndGenerate(file) {
  const formData = new FormData();
  formData.append('file', file);

  // 创建 AbortController，用于取消按钮和超时
  abortController = new AbortController();
  abortedByTimeout = false;

  try {
    const resp = await fetch(`/api/generate?mode=${currentMode}`, {
      method: 'POST',
      body: formData,
      signal: abortController.signal,
    });

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.detail || `服务器错误 (${resp.status})`);
    }

    const data = await resp.json();
    scenes = data.scenes || [];

    // 检测自动降级
    if (data.fallback) {
      console.log('[frontend] 模板未匹配，已自动降级为 AI 生成');
    }

    // 模板成功 → lesson_json；降级 → animation_html
    if (data.lesson_json) {
      window._lessonData = data.lesson_json;
      animationHtml = '';
    } else if (data.animation_html) {
      window._lessonData = null;
      animationHtml = data.animation_html;
    } else {
      throw new Error('AI 未能生成有效动画内容，请重试。');
    }
    currentSceneIdx = 0;

    stopLoadingAnimation();
    $('loaderBar').style.width = '100%';
    await sleep(400);
    showPlayer();

  } catch (err) {
    stopLoadingAnimation();
    console.error('Upload error:', err);
    // 用户主动取消或超时 → 静默回到上传页
    if (err.name === 'AbortError') {
      if (abortedByTimeout) {
        // 超时触发的 abort，错误卡片已由 showError 显示，不要切回上传页
        return;
      }
      // 用户点取消按钮，静默回到上传页
      switchState(STATE.UPLOAD);
      return;
    }
    // 区分网络错误（服务器未启动）和业务错误
    if (err.message === 'Failed to fetch' || err.name === 'TypeError') {
      showError('无法连接服务器', '请确认服务已启动后重试。');
    } else {
      showError('生成失败', err.message);
    }
  }
}

function showError(title, detail) {
  $('errorArea').innerHTML = `
    <div class="error-card">
      <div class="err-icon">&#9888;</div>
      <div class="err-title">${escapeHtml(title)}</div>
      <div class="err-detail">${escapeHtml(detail)}</div>
      <button class="retry-btn" onclick="switchState(STATE.UPLOAD)">&#8634; 重新上传</button>
    </div>
  `;
  $('cancelBtn').style.display = 'none';
  $('statusText').style.display = 'none';
  $('statusSub').style.display = 'none';
}

// ═══════════════════════════════════════════════
//  State 3 — Fullscreen Player
// ═══════════════════════════════════════════════
function showPlayer() {
  switchState(STATE.PLAYER);

  const iframe = $('animationFrame');
  currentSceneIdx = 0;

  if (window._lessonData) {
    // ── 动画模板：加载播放器 + postMessage ──
    const playerUrl = currentMode === '2d'
      ? '/player-template-2d.html'
      : '/player-template.html';
    iframe.addEventListener('load', function onLoad() {
      iframe.removeEventListener('load', onLoad);
      iframe.contentWindow.postMessage(
        { type: 'lesson-data', payload: window._lessonData },
        '*'
      );
      updateNavUI();
    }, { once: true });
    iframe.src = playerUrl;
  } else {
    // ── 降级：AI 直接生成 HTML，srcdoc 注入 ──
    iframe.srcdoc = '';
    iframe.src = '';  // 清除 src（否则 srcdoc 不生效）
    iframe.addEventListener('load', function onLoad() {
      iframe.removeEventListener('load', onLoad);
      tryNavigateScene(0);
      updateNavUI();
    }, { once: true });
    iframe.srcdoc = animationHtml;
  }

  // Reset UI
  $('navOverlay').classList.remove('hidden');
  $('topBar').classList.remove('hidden');
  resetAutoHideTimer();
}

function tryNavigateScene(idx) {
  try {
    const iframe = $('animationFrame');
    if (iframe.contentWindow && typeof iframe.contentWindow.changeScene === 'function') {
      iframe.contentWindow.changeScene(idx);
      currentSceneIdx = idx;
    }
  } catch (e) {
    console.warn('Cannot call changeScene:', e.message);
  }
}

function updateNavUI() {
  const total = scenes.length || 1;
  $('btnPrev').disabled = (currentSceneIdx === 0);
  $('btnNext').disabled = (currentSceneIdx >= total - 1);
  $('counter').textContent = `${currentSceneIdx + 1} / ${total}`;

  // Render dots
  const dotsEl = $('dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('span');
    dot.className = 'dot' + (i === currentSceneIdx ? ' active' : '');
    dot.addEventListener('click', () => navigateTo(i));
    dotsEl.appendChild(dot);
  }
}

function navigateTo(idx) {
  const total = scenes.length || 1;
  idx = Math.max(0, Math.min(idx, total - 1));
  tryNavigateScene(idx);
  currentSceneIdx = idx;
  updateNavUI();
}

// Navigation buttons
$('btnPrev').addEventListener('click', () => navigateTo(currentSceneIdx - 1));
$('btnNext').addEventListener('click', () => navigateTo(currentSceneIdx + 1));

// Keyboard
document.addEventListener('keydown', (e) => {
  if (currentState !== STATE.PLAYER) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navigateTo(currentSceneIdx - 1); resetAutoHideTimer(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); navigateTo(currentSceneIdx + 1); resetAutoHideTimer(); }
});

// Reupload
$('reuploadBtn').addEventListener('click', () => {
  const iframe = $('animationFrame');
  iframe.srcdoc = '';
  iframe.src = '';
  scenes = [];
  animationHtml = '';
  window._lessonData = null;
  currentSceneIdx = 0;
  switchState(STATE.UPLOAD);
});

// Cancel button
$('cancelBtn').addEventListener('click', () => {
  if (abortController) abortController.abort();
  stopLoadingAnimation();
  switchState(STATE.UPLOAD);
});

// Auto-hide overlay
function resetAutoHideTimer() {
  $('navOverlay').classList.remove('hidden');
  $('topBar').classList.remove('hidden');
  if (hideOverlayTimer) clearTimeout(hideOverlayTimer);
  hideOverlayTimer = setTimeout(() => {
    $('navOverlay').classList.add('hidden');
    $('topBar').classList.add('hidden');
  }, 3000);
}

document.addEventListener('mousemove', () => {
  if (currentState === STATE.PLAYER) resetAutoHideTimer();
});
document.addEventListener('touchstart', () => {
  if (currentState === STATE.PLAYER) resetAutoHideTimer();
});

// ═══════════════════════════════════════════════
//  Utilities
// ═══════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
