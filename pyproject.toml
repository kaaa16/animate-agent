[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animate-agent"
version = "0.1.0"
description = "Agent that turns technical manuals into visual teaching pages and interactive animation demos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Animate Agent Team" }]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.0",
  "pypdf>=5.7.0",
  "beautifulsoup4>=4.13.0",
  "readability-lxml>=0.8.4.1",
  "markdown-it-py>=3.0.0",
  "python-pptx>=0.6.21",
  "python-docx>=0.8.11",
  "python-multipart>=0.0.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "mypy>=1.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_return_any = true
