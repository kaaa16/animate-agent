<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智教 · 把文档变成动画</title>
    <link rel="stylesheet" href="./web.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="kicker">智教 · 文档 → 动画</p>
        <h1>把一份文档，变成一段会动的讲解</h1>
        <p class="lede">
          拖一份文档进来，或者直接聊你想讲什么——聊清楚了，它先把你的想法写成一篇稿子，
          再把稿子读成课程、拆成分镜、布局成一张能播放的画面。
          支持 pptx / docx / pdf / md / markdown / txt。
        </p>
      </header>

      <section class="card">
        <!--
          The drop zone and the chat are the same box, and the id is still
          `dropZone` because it is the drop target: `app.js` binds four drag
          handlers to it, `is-dragging` is styled on it, and
          `tests/unit/test_api_mounts.py` asserts this id is on the page. Nothing
          about turning it into a conversation changes any of that.
        -->
        <div class="chat" id="dropZone">
          <input
            id="fileInput"
            type="file"
            hidden
            accept=".pptx,.docx,.pdf,.md,.markdown,.txt"
          />

          <!--
            Messages are appended here by `app.js` as elements it builds node by
            node with `createElement` and `textContent` — never by handing the
            browser a string of markup, because some of this text is written by
            the model (decision D4). The first one is written out here rather
            than added on load: it is a hint, and it should be there before any
            script runs.
          -->
          <ol class="chat-log" id="chatLog" aria-live="polite">
            <li class="bubble from-ai">
              把文件拖进来，或者直接说说你想讲什么。想好了点「生成动画」。
            </li>
          </ol>

          <div class="composer">
            <button type="button" class="pick" id="pickBtn">选择文件</button>
            <textarea
              id="chatInput"
              rows="1"
              placeholder="说说你想讲什么…（文件也可以直接拖到这块里）"
            ></textarea>
            <button type="button" class="pick" id="sendBtn">发送</button>
          </div>

          <div class="actions">
            <p class="status" id="fileStatus">还没有挂文件。</p>
            <button type="button" class="pick unpick" id="clearFileBtn" hidden>移除文件</button>
            <button type="button" class="go" id="goBtn" disabled>生成动画</button>
          </div>
        </div>

        <!--
          One control, not two. It used to be a 「加配音」 checkbox *and* this
          select, with the select `disabled` until the box was ticked — which
          meant a closed select showed 云健 · 男声 and nothing else, so the female
          voice was invisible to anyone who had not ticked the box. The empty
          first option is what the checkbox used to say: nothing chosen means no
          `speak` field is sent, and the server falls back to the config, which
          ships off.

          The voice ids are spelled out here, which makes this the third copy of
          a list `speech/voices.py` owns and `player/voice.js` mirrors; the
          extensions at the top of `app.js` are duplicated for the same reason
          (this page is a classic script and cannot import a module), and both are
          held to their source by `tests/unit/test_web_page.py` and
          `tests/unit/test_player_voice.py`.
        -->
        <div class="options">
          <label class="option">
            <span class="option-label">音色</span>
            <select id="voiceSelect">
              <option value="">不要配音</option>
              <option value="zh-CN-YunjianNeural">云健 · 男声播报</option>
              <option value="zh-CN-XiaoyiNeural">晓伊 · 女声活泼</option>
              <option value="zh-CN-YunjianNeural,zh-CN-XiaoyiNeural">
                两个都要（播放器里可切换，多花约半分钟）
              </option>
            </select>
          </label>
        </div>
      </section>

      <!--
        Shown only while a request is in flight. The bar is indeterminate on
        purpose: the server has one request and no progress channel, so anything
        that filled it stage by stage would be invented rather than observed.
      -->
      <section class="progress" id="progress" hidden>
        <div class="bar" role="progressbar" aria-label="正在生成，没有进度百分比"></div>
        <p class="progress-line" id="progressLine">正在生成…</p>
      </section>

      <p class="alert" id="alert" role="alert" hidden></p>

      <section class="result" id="result" hidden>
        <div class="result-head">
          <div>
            <p class="result-label">生成的动画</p>
            <h2 id="resultTitle"></h2>
            <p class="result-meta" id="resultMeta"></p>
          </div>
          <a class="open" id="openLink" target="_blank" rel="noopener">在新标签页打开</a>
        </div>
        <!--
          The player is loaded in a frame rather than imported: `player.js`
          binds half a dozen DOM nodes at module scope and reads the spec from
          `window.location.search`, so it needs to own its own document.
        -->
        <iframe id="player" title="动画播放器"></iframe>
      </section>

      <noscript>
        <p class="alert">
          这个页面需要 JavaScript：聊天、选择文件、上传、播放都靠它。
        </p>
      </noscript>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
