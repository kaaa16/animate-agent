<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智教 · 动画播放器</title>
    <link rel="stylesheet" href="./player.css" />
    <!--
      The remembered palette is applied before the first paint, not from
      `player.js`. A module script runs only after the document is parsed, so
      the page would render the default dark palette for a frame and then swap
      to a light one: a black flash on every reload, which reads as a bug in the
      palette rather than as a timing detail.

      There is no validation here and there does not need to be. An id with no
      `[data-theme]` block in the stylesheet matches nothing and falls through
      to `:root` — which holds the same palette `resolveTheme` would settle on.
      `themes.js` owns the ids, the labels and the key; this only has to spell
      the key the same way, and `test_the_prepaint_script_reads_the_same_key`
      compares the two strings.
    -->
    <script>
      try {
        const asked =
          new URLSearchParams(location.search).get("theme") ||
          localStorage.getItem("player-theme");
        if (asked) document.documentElement.dataset.theme = asked;
      } catch (error) {
        // A browser that refuses `localStorage` still gets a working page; it
        // just gets the default palette, which is the right answer anyway.
      }
    </script>
  </head>
  <body>
    <!--
      The film's name, and nothing else. This header used to carry a scene
      counter, the storyboard's eyebrow and the current scene's teaching goal —
      three fields that changed while you watched, which is what made the page
      read as an inspector rather than as a player. The name is the one thing a
      video keeps saying, so it is the one thing left.
    -->
    <header class="bar">
      <h1 id="title">载入中…</h1>
      <!--
        Filled in by `player.js` from `themes.js`. The buttons are built rather
        than written out here so that a palette cannot be added to the
        stylesheet and left unreachable — there is one list, and it is the one
        the picker reads.
      -->
      <div class="theme-picker">
        <span class="theme-picker-label">配色</span>
        <div class="themes" id="themes"></div>
      </div>

      <!--
        Filled in by `player.js` from `voice.js`, and hidden outright when the
        spec carries fewer than two voices — a film read by one narrator has
        nothing to choose between, and a picker with one button in it reads as a
        control that is broken. Hidden here from the start for the same reason:
        it must not flash on a spec with no speech at all.
      -->
      <div class="theme-picker" id="voice-picker" hidden>
        <span class="theme-picker-label">配音</span>
        <div class="themes" id="voices"></div>
      </div>
    </header>

    <main class="layout">
      <!--
        The element fullscreen is asked for, and deliberately the stage and the
        bar together rather than the page: a video player in fullscreen shows
        the film and its controls, not the site around it. The palette and voice
        pickers outside this element are the one thing a real player has no
        equivalent of, so fullscreen is exactly where they should not be.
      -->
      <section class="player" id="player">
        <div class="stage-wrap">
          <canvas id="stage"></canvas>
          <!--
            Errors are rendered on the page rather than swallowed. A blank canvas
            and a badly-drawn one are indistinguishable to a person looking at
            the screen, so the player says which one it is (decision: visible
            errors).
          -->
          <pre class="error" id="error" hidden></pre>
          <!--
            Browsers hold audio back until the page has been interacted with, and
            they do not say so — the only signal is a rejected `play()`. This is
            the page saying it instead.

            It is much rarer than it was. The player opens paused, so the press
            that starts the film is itself the gesture and the first beat has its
            voice; this only appears when a link that asked to start immediately
            was opened without one.
          -->
          <p class="voice-hint" id="voice-hint" hidden>
            点一下页面开始配音（画面不等它）
          </p>
        </div>

        <!--
          The transport bar, which is the whole of what this page gained. Its
          `input`s carry ids rather than classes because `player.js` writes them
          the same way it writes every other control on the page — see the note
          at the top of that file about `textContent` and model-authored strings.
        -->
        <div class="transport">
          <button type="button" id="play" title="播放 / 暂停（空格）">播放</button>
          <span class="clock" id="clock">--:-- / --:--</span>
          <input
            id="seek"
            class="seek"
            type="range"
            min="0"
            max="0"
            step="0.01"
            value="0"
            aria-label="播放进度"
          />
          <button type="button" id="mute" title="静音">静音</button>
          <input
            id="gain"
            class="gain"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
            aria-label="音量"
          />
          <button type="button" id="fullscreen" title="全屏（全屏里只有画面和这条控制栏）">
            全屏
          </button>
          <button type="button" id="download" title="从头播一遍并录下来，存成一个视频文件">
            下载视频
          </button>
        </div>

        <!--
          Where the recording says what it is doing. Its own element rather than
          the error plate: ninety seconds of "录制中" is not a failure, and the
          one thing that *can* go wrong — switching tabs freezes the picture,
          because frames come from `requestAnimationFrame` — is a warning worth
          giving before it happens rather than after.
        -->
        <p class="record-note" id="record-note" hidden></p>
      </section>

      <aside class="side">
        <div>
          <h2>控制台</h2>
          <div class="controls" id="controls"></div>
        </div>
      </aside>
    </main>

    <script type="module" src="./player.js"></script>
  </body>
</html>
