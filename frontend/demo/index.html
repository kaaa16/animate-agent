<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intuition Engine Agent</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./intuition-home.css" />
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="aurora aurora-one" aria-hidden="true"></div>
    <div class="aurora aurora-two" aria-hidden="true"></div>

    <main class="home-shell">
      <section class="hero" aria-label="Intuition Engine Agent 输入页">
        <p class="brand-kicker">Intuition Engine Agent</p>
        <h1>把文本变成 2D / 3D 教学动画</h1>
        <p class="subtitle">
          粘贴一段介绍、拖入文档，或导入本地文件。Agent 会把抽象概念拆成对象、关系、镜头和可交互演示。
        </p>

        <form class="prompt-box" id="promptBox">
          <input id="fileInput" type="file" hidden accept=".txt,.md,.markdown,.json,.csv,.py,.js,.ts,.tsx,.html,.css,.pdf,.ppt,.pptx,.doc,.docx" />
          <button class="add-button" id="addFileBtn" type="button" aria-label="导入本地文件" title="导入本地文件">
            <span aria-hidden="true">+</span>
          </button>
          <textarea
            id="sourceInput"
            spellcheck="false"
            placeholder="输入一段文档、PPT 大纲或开源项目 introduction..."
          ></textarea>
          <div class="prompt-actions">
            <span id="fileStatus">支持拖拽文件到这里</span>
            <button id="generateBtn" type="submit">生成动画分镜</button>
          </div>
        </form>

        <div class="quick-prompts" aria-label="示例输入">
          <button type="button" data-sample="robot">机器人避障</button>
          <button type="button" data-sample="transformer">Transformer 注意力</button>
          <button type="button" data-sample="repo">开源项目简介</button>
        </div>
      </section>

      <section class="planet-stage" aria-label="旋转地球视觉背景">
        <canvas id="earthCanvas"></canvas>
        <div class="orbit-ring orbit-a" aria-hidden="true"></div>
        <div class="orbit-ring orbit-b" aria-hidden="true"></div>
      </section>
    </main>

    <aside class="result-dock" id="resultDock" aria-live="polite">
      <div>
        <span>识别结果</span>
        <strong id="resultTitle">等待输入</strong>
      </div>
      <p id="resultSummary">输入内容后，这里会预览 Agent 将如何拆解教学动画。</p>
    </aside>

    <!-- Legacy prototype retained for reference; disabled so malformed old copy cannot affect the new home page.
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <p class="eyebrow">Manual Animator Agent</p>
            <h1>把技术手册转成可互动教学动画</h1>
          </div>
        </div>
        <div class="status-strip" aria-label="系统状态">
          <span>解析</span>
          <span>分镜</span>
          <span>动画</span>
          <span>互动</span>
        </div>
      </header>

      <main class="workspace">
        <section class="input-panel panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Source Manual</p>
              <h2>文档输入</h2>
            </div>
            <button id="loadSampleBtn" class="ghost-btn">载入避障手册</button>
          </div>
          <textarea id="manualInput" spellcheck="false"></textarea>
          <div class="action-row">
            <button id="analyzeBtn" class="primary-btn">生成教学分镜</button>
            <button id="rosSampleBtn" class="ghost-btn">切换 ROS 课件</button>
            <button id="apiSampleBtn" class="ghost-btn">切换 API 鉴权样例</button>
          </div>
        </section>

        <section class="analysis-panel panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Agent Reasoning</p>
              <h2>理解结果</h2>
            </div>
            <span id="docType" class="chip">机器人手册</span>
          </div>
          <div class="insight-grid">
            <article>
              <span>核心对象</span>
              <strong id="objectsText">小车 / 激光雷达 / 障碍物 / 控制器</strong>
            </article>
            <article>
              <span>核心逻辑</span>
              <strong id="logicText">扫描距离低于安全阈值时，控制器改变转向角</strong>
            </article>
            <article>
              <span>可互动参数</span>
              <strong id="paramsText">车速、雷达半径、安全距离、障碍密度</strong>
            </article>
          </div>
          <div id="storyboard" class="storyboard"></div>
        </section>

        <section class="stage-panel panel">
          <div class="panel-head stage-head">
            <div>
              <p class="eyebrow">Interactive Demo</p>
              <h2 id="demoTitle">小车避障动画实验台</h2>
            </div>
            <div class="playback">
              <button id="playBtn" class="icon-btn" aria-label="播放或暂停">▶</button>
              <button id="resetBtn" class="icon-btn" aria-label="重置">↺</button>
            </div>
          </div>

          <div class="demo-layout">
            <div class="canvas-wrap">
              <canvas id="demoCanvas" width="980" height="620"></canvas>
              <div class="hud">
                <span id="phaseText">阶段 1 / 雷达扫描</span>
                <span id="decisionText">等待传感器回波</span>
              </div>
            </div>

            <aside class="control-deck">
              <label>
                <span>车速</span>
                <input id="speedRange" type="range" min="0.4" max="2.2" value="1.0" step="0.1" />
              </label>
              <label>
                <span>雷达半径</span>
                <input id="lidarRange" type="range" min="90" max="210" value="150" step="5" />
              </label>
              <label>
                <span>安全距离</span>
                <input id="safeRange" type="range" min="45" max="120" value="76" step="2" />
              </label>
              <label>
                <span>障碍密度</span>
                <input id="densityRange" type="range" min="2" max="7" value="4" step="1" />
              </label>
              <button id="stepBtn" class="primary-btn">单步讲解</button>
              <p id="explainText" class="explain">
                激光雷达像一把旋转的尺子：每条射线测量前方距离，最近距离低于安全距离时，控制器选择空旷方向绕行。
              </p>
            </aside>
          </div>
        </section>
      </main>
    </div>
    -->
    <script src="./intuition-home.js"></script>
  </body>
</html>
